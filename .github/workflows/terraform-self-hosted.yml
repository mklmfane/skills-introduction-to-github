name: Terraform on Vagrant runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/terraform-self-hosted.yml"
      - "terraform/basic/**"

permissions:
  contents: read

concurrency:
  group: terraform-basic-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform-basic:
    name: Terraform basic example
    runs-on: [self-hosted, linux, x64, vagrant, virtualbox, github-skills]
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: terraform/basic

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Show Terraform version
        run: terraform version

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false -no-color

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Create plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply plan
        run: terraform apply -input=false -no-color -auto-approve tfplan

      - name: Show Terraform output
        run: terraform output -no-color

      - name: Destroy demonstration resource and clean state
        if: always()
        run: |
          terraform destroy -input=false -no-color -auto-approve || true
          rm -rf .terraform terraform.tfstate terraform.tfstate.backup tfplan
